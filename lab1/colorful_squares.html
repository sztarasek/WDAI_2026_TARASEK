<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div .square {
            height: 100px;
            width: 100px;
            margin: 10px;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column;">
    <div style="display: flex;">
        <div class="square" style="background-color: red;"></div>
        <div class="square" style="background-color: blue;"></div>
    </div>
    <div style="display: flex;">
        <div class="square" style="background-color: green;"></div>
        <div class="square" style="background-color: yellow; background-image: url(imgs/lights-each-other-arranged-circular-order.jpg); background-position: center;"></div>
        <div class="square" style="background-color: black;"></div>
    </div>
</body>
</html>
